# TEMPLATE: Drop-in for jsm-auto-update.service (install that first); re-applies local skill policy after every jsm update.
# Replace before enabling:
#   nothing; the defaults are generic.
# See systemd/README.md.

# Re-assert local skill policy immediately after every jsm auto-update attempt.
#
# WHY: jsm-auto-update.timer runs daily at 03:00 and re-adds skills we retired,
# always model-invocable. Measured 2026-07-30: eight retired skills were back in
# the always-on prompt budget by 03:00:12, and skills-localize.sh — written for
# exactly this — was wired to nothing. Drift was both unfixed and invisible.
#
# A drop-in, not an edit to jsm-auto-update.service: that unit is installed and
# may be rewritten by jsm itself, which would silently drop an inline edit.
#
# ExecStopPost runs after either update success or failure. It is deliberately
# unmasked so reconciliation failure can fail the unit, making the service
# Result cover both the JSM update and local policy. Since 2026-09-02 the
# author's install closeout also runs the localizer, so a merge goes live
# within it; this drop-in stays as the jsm-path guard.
#
# NOTE: `apply` DELETES anything listed in retired-skills.txt. Before
# adding a skill to that file, confirm you mean "uninstall it", not "stop it
# auto-loading" — the latter is skillOverrides: user-invocable-only.
#
# INSTALL ORDERING — install this ONLY via `sync.sh install`, never by hand from
# a worktree. ~/.claude/scripts symlinks to the MAIN checkout, so the reconciler
# always reads main's retired-skills.txt. Arming the drop-in while a manifest fix
# is still unmerged points a live deleter at a stale list. Hit during this PR:
# the drop-in was armed for ~4 minutes against the old manifest, which would have
# deleted all seven un-retired skills at the next 03:00. sync.sh install lands the
# manifest and the drop-in together, so they can never disagree.

[Service]
ExecStopPost=%h/.claude/scripts/skills-localize.sh apply
