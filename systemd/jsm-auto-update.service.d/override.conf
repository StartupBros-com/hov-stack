# TEMPLATE: Drop-in for jsm's own jsm-auto-update.service (install that first); pages on failure and runs the tracked wrapper instead of jsm's auto-update.
# Replace before enabling:
#   nothing; the defaults are generic.
# See systemd/README.md.

# JSM's `auto-update run` deadlocked in v0.3.10; the deadlock was re-proven
# at v0.3.18 with a 180s non-TTY timeout. Keep the explicit, observable
# per-skill update path in the tracked wrapper instead.

[Unit]
# Page on failure, like the sibling scheduled units.
#
# This was missing, with no "NO OnFailure= ON PURPOSE" rationale anywhere, and
# it cost five consecutive silent nightly failures (Sep 15-19 2026, exit 1 at
# 03:00 every night). Nothing paged, and `journalctl -u jsm-auto-update.service`
# showed a bare "status=1/FAILURE" with the reason stripped out -- see the
# streaming comment in jsm-auto-update-wrapper.sh for why the reason was in the
# journal but unattributed.
#
# WIRED ONLY BECAUSE THE NIGHTLY FAILURE IS NOW RESOLVED. Arming an alert on a
# unit that fails every night manufactures exactly the fatigue that makes real
# pages invisible; that would have been a worse outcome than the silence. The
# cause was jsm v0.3.22 trying to PROMPT during a non-interactive upgrade of
# saas-billing-patterns-for-stripe-and-paypal ("User prompt error: IO error:
# not a terminal") and printing a bare "Failed:" heading, which the wrapper
# correctly converts into a unit failure. That skill was pinned at v12 on this
# host; the wrapper names any pinned skill nightly as "pinned, not updated" --
# visible, not swallowed -- and exits 0.
#
# The prompt was jsm asking whether to overwrite that skill's
# skills-patches overlay. The pin fixed one skill; every other overlay
# skill hit the same refusal as its updates arrived, and the unit failed 13 of
# the 14 nights to 2026-10-17. Holding each overlay skill whose update touched
# an overlaid file followed, and held 10 of 12. Since dotfiles#2091 the wrapper
# takes the local layer off each skill before jsm upgrades it
# (skills-localize.sh unapply) and ExecStopPost lays it back over the new
# version, so jsm never sees a local edit and no pin is needed.
OnFailure=harness-unit-failure-alert@%n.service

[Service]
# The wrapper resolves jsm from the user manager's HOME by default; tests may
# override JSM_BIN without hardcoding a host-specific PATH into this unit.
# JSM v0.3.18's vendor unit accepts status 1, but the wrapper uses it to turn a
# printed Failed: heading into an authoritative unit failure.
SuccessExitStatus=
ExecStart=
ExecStart=%h/.claude/scripts/jsm-auto-update-wrapper.sh
