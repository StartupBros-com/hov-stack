# Paired with fstrim.timer.d/10-wsl.conf — see that file for the full story
# and the one-time operator step (stock
# ConditionVirtualization=!container reads WSL2 as a container, so TRIM
# never ran and the host-side ext4.vhdx grew to its ~1TB cap, causing the
# 2026-08-21 emergency reset). Both units carry the same condition upstream,
# so both need it cleared: a runnable timer firing a condition-blocked
# service would still trim nothing — and read as green.
[Unit]
ConditionVirtualization=
