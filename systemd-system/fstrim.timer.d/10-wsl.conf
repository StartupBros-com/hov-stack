# WSL2 reads as a container to systemd's virtualization detection, so stock
# Ubuntu's ConditionVirtualization=!container silently disabled fstrim.timer
# here — "enabled" for years, scheduled never ("start condition unmet").
# With TRIM never running, freed blocks were never marked reusable on the
# host side, so the ext4.vhdx on the Windows drive could only GROW. It
# ground into its ~1TB cap and filled C:, forcing the 2026-08-21 emergency
# reset. The empty assignment clears the inherited condition
# list; the paired drop-in on fstrim.service does the same for the service.
#
# Verified live 2026-08-21: manual fstrim trimmed 367.5 GiB inside the VM.
# NOTE the second half of the fix is one-time and operator-side: the vhdx
# predates [experimental] sparseVhd=true and is NOT sparse (fsutil sparse
# queryflag), so trims do not reach the host until
#   wsl --shutdown && wsl --manage Ubuntu --set-sparse true
# is run once from Windows. After that, this weekly trim keeps the vhdx
# from re-ballooning.
[Unit]
ConditionVirtualization=
