<!doctype html>
<!--
  Source of design/team-members.png. Exact values, kept out of the arms' repo.
  Planted (see answer-key.md): header-to-list gap 24px (no spacing step; 16 and 32 exist),
  badge colours #ccfbf1 / #0f766e (no palette step), no Badge component in the project,
  email text #d1d5db = gray-300 (an exact token that fails contrast on white),
  a drawn pending-invite row (a state the design does show), and every other value on a token.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { background: #f9fafb; padding: 32px; font-family: Inter, "Helvetica Neue", Arial, sans-serif; width: 784px; }
  .card { width: 720px; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .title { font-size: 16px; line-height: 24px; font-weight: 600; color: #111827; }
  .desc { font-size: 14px; line-height: 20px; color: #6b7280; }
  .btn { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 14px; line-height: 20px; font-weight: 500; border: 0; }
  .btn-primary { background: #4f46e5; color: #ffffff; }
  .btn-ghost { background: transparent; color: #4f46e5; }
  .list { margin-top: 24px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #e5e7eb; }
  .avatar { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9999px; background: #f3f4f6; color: #374151; font-size: 12px; line-height: 16px; font-weight: 500; }
  .name { font-size: 14px; line-height: 20px; font-weight: 500; color: #111827; }
  .name.pending { color: #6b7280; }
  .email { font-size: 14px; line-height: 20px; color: #d1d5db; }
  .end { margin-left: auto; }
  .badge { display: inline-flex; padding: 4px 8px; border-radius: 9999px; background: #ccfbf1; color: #0f766e; font-size: 12px; line-height: 16px; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div>
        <div class="title">Team members</div>
        <div class="desc">Manage who can access this workspace.</div>
      </div>
      <button class="btn btn-primary">Invite member</button>
    </div>
    <div class="list">
      <div class="row">
        <span class="avatar">MC</span>
        <div><div class="name">Maya Chen</div><div class="email">maya@acme.example</div></div>
        <span class="end badge">Owner</span>
      </div>
      <div class="row">
        <span class="avatar">JW</span>
        <div><div class="name">Jonas Weber</div><div class="email">jonas@acme.example</div></div>
        <span class="end badge">Admin</span>
      </div>
      <div class="row">
        <span class="avatar">PR</span>
        <div><div class="name">Priya Raman</div><div class="email">priya@acme.example</div></div>
        <span class="end badge">Member</span>
      </div>
      <div class="row">
        <span class="avatar">L</span>
        <div><div class="name pending">Invitation sent</div><div class="email">lee@acme.example</div></div>
        <button class="end btn btn-ghost">Resend</button>
      </div>
    </div>
  </div>
</body>
</html>
