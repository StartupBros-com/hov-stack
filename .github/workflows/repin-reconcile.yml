name: Repin reconcile

# Keep the distribution manifest converging on what the plugins have actually
# released: open a repin PR whenever the two disagree, ask GitHub to merge it once
# its required checks pass, close the repin PRs it superseded, and publish the
# staged draft release a card on main already names.
# A migration dispatch changes one entry to git-subdir through the same PR flow.
# HOV_RELEASE_APP_REPOSITORIES configures the release App token repository list.
#
# The card still changes only through a PR on main that passes the required
# checks; this workflow pushes nothing to main and holds no bypass. What it
# removed is the human typing between "the checks are green" and "merge", and
# between "the card names the draft" and "publish", which nobody did reliably.
#
# The write is local — a branch and a PR in THIS repository. The reads are release
# metadata on the plugin repositories. Draft-first means the release that needs
# pinning is a DRAFT, and drafts are invisible to any token without push on that
# repository — including this repository's GITHUB_TOKEN. So the reads use a
# short-lived token minted from the org's least-privilege release App
# (HOV_RELEASE_APP_ID + HOV_RELEASE_APP_PRIVATE_KEY, contents read/write on the
# plugin repositories only). The token must carry contents: write because GitHub
# shows drafts only to push-capable identities. Its one write is publishing a
# draft that a card on main already pins (release/scripts/repin-publish.sh), after
# re-checking tag, version, commit, default-branch ancestry and uploaded assets,
# and it expires with the job. Without those secrets the job falls back to
# GITHUB_TOKEN, sees only published releases, and publishes nothing.
#
# The PR is opened, queued for auto-merge, and closed when superseded as the
# StartupBros HOV Marketplace Bot App (HOV_MARKETPLACE_APP_ID +
# HOV_MARKETPLACE_APP_PRIVATE_KEY, contents and pull-request write on THIS
# repository only): the organization keeps GitHub's default that forbids
# GITHUB_TOKEN from creating pull requests, and a PR opened by an App token runs
# the validator without the approval gate a GITHUB_TOKEN-created PR would sit
# behind. Auto-merge is requested only after release/scripts/repin-land.sh proves the PR
# changes nothing but the manifest and carries exactly the reconciler's output.
# The merge still waits for the required checks and every ruleset on main.
# Without the bot secrets the branch is still pushed and the run tells you which
# PR to open by hand.

on:
  # Every push to main. A merged repin publishes its draft at once, and a push that
  # leaves an open card BEHIND gets a fresh card at once: main's sha is part of the
  # card's key, so this run opens a new card and repin-land.sh closes the stale one.
  # A run with no drift opens nothing and takes under a minute.
  push:
    branches: [main]
  # A finished Release run: release.yml has just staged a plugin's draft (hov-stack#438).
  # Release runs on a tag, so there is no branches filter; one would be matched against
  # the tag and never fire. The run still checks out main, never the tag. There is no
  # conclusion gate either: concurrency is per workflow, so a run whose job was skipped
  # would still take the pending slot and cancel a pending push run, and reconciling
  # after a failed stage is as safe as any other run.
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    # The fallback when neither event above arrives. GitHub delays and drops scheduled
    # runs: on 2026-10-17 the hourly '23 * * * *' ran seven times, 2.2-5.3 hours apart,
    # and from 2026-10-29 to 2026-11-05 four ticks an hour delivered 27 runs of about 670.
    # The ticks stay off :00, where every scheduled job on GitHub piles up.
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      migrate_plugin:
        description: 'Migrate one plugin to a git-subdir entry pinned to its newest prefixed release in the shared repository (optional; opens the PR the reconciler would)'
        required: false
        type: string
      only_plugin:
        description: 'Restrict to one plugin name (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: repin-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          persist-credentials: false

      - name: Decide whether the release App is available for draft-visible reads
        id: identity
        env:
          HOV_RELEASE_APP_ID: ${{ secrets.HOV_RELEASE_APP_ID }}
          HOV_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HOV_RELEASE_APP_PRIVATE_KEY }}
          APP_REPOSITORIES: ${{ vars.HOV_RELEASE_APP_REPOSITORIES }}
        run: |
          if [ -n "$HOV_RELEASE_APP_ID" ] && [ -n "$HOV_RELEASE_APP_PRIVATE_KEY" ]; then
            if [ -z "$APP_REPOSITORIES" ]; then
              echo "::error::repository variable HOV_RELEASE_APP_REPOSITORIES is empty; set it to the comma-separated plugin repositories the release App token is minted for"
              exit 1
            fi
            echo "have_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_app=false" >> "$GITHUB_OUTPUT"
            echo "::warning::release App secrets are not visible to this repository; reads use GITHUB_TOKEN and cannot see staged DRAFT releases, so draft-first repins will not be opened automatically."
          fi

      # Plugin-repositories-only token. GitHub lists another repository's DRAFT releases only
      # to identities with push access, so the token must carry contents: write even though
      # this workflow only reads with it (verified 2026-09-06: a contents: read token saw no
      # draft and reported "already matches"). It lives for this job; its list is the repository
      # variable HOV_RELEASE_APP_REPOSITORIES, so adding a plugin, freezing the per-plugin
      # repositories or renaming this repository changes a setting and not this workflow.
      - name: Mint a release App token for the plugin repositories (draft-visible)
        if: steps.identity.outputs.have_app == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOV_RELEASE_APP_ID }}
          private-key: ${{ secrets.HOV_RELEASE_APP_PRIVATE_KEY }}
          owner: StartupBros-com
          repositories: ${{ vars.HOV_RELEASE_APP_REPOSITORIES }}
          permission-contents: write
          permission-metadata: read

      - name: Reconcile the manifest against released plugins
        id: reconcile
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          ONLY_PLUGIN: ${{ inputs.only_plugin }}
          MIGRATE_PLUGIN: ${{ inputs.migrate_plugin }}
          PLAN_FILE: ${{ runner.temp }}/repin-plan.tsv
        run: |
          set -euo pipefail
          if [ -n "$MIGRATE_PLUGIN" ]; then ./release/scripts/repin-migrate.sh "$MIGRATE_PLUGIN"; else ./release/scripts/repin-reconcile.sh; fi
          if [ -s "$PLAN_FILE" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            # Content-addressed branch name: the SAME drift on the SAME main always
            # produces the SAME branch, so a second run finds the PR already open
            # and opens nothing. That is what makes a frequent schedule safe. Main's
            # sha is in the key because the required checks demand an up-to-date
            # branch: once main moves, the old PR can never merge, so the next run
            # opens a fresh one and repin-land.sh closes the old.
            key="$( { cat "$PLAN_FILE"; git rev-parse HEAD; } | sha256sum | cut -c1-12)"
            echo "key=$key" >> "$GITHUB_OUTPUT"
            echo "blob=$(git hash-object .claude-plugin/marketplace.json)" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether the marketplace bot is available to open and land the PR
        id: bot_identity
        env:
          HOV_MARKETPLACE_APP_ID: ${{ secrets.HOV_MARKETPLACE_APP_ID }}
          HOV_MARKETPLACE_APP_PRIVATE_KEY: ${{ secrets.HOV_MARKETPLACE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$HOV_MARKETPLACE_APP_ID" ] && [ -n "$HOV_MARKETPLACE_APP_PRIVATE_KEY" ]; then
            echo "have_bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_bot=false" >> "$GITHUB_OUTPUT"
            echo "::warning::marketplace bot secrets are not visible; a repin branch will be pushed but the PR must be opened and merged by hand (GITHUB_TOKEN may not create pull requests in this organization)."
          fi

      # Minted on every run, drift or not: with no drift it closes repin PRs main already covers.
      - name: Mint a marketplace-bot token for this repository
        if: steps.bot_identity.outputs.have_bot == 'true'
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOV_MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.HOV_MARKETPLACE_APP_PRIVATE_KEY }}

      - name: Open the repin PR
        if: steps.reconcile.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          HAVE_BOT: ${{ steps.bot_identity.outputs.have_bot }}
          MIGRATE_PLUGIN: ${{ inputs.migrate_plugin }}
          PLAN_FILE: ${{ runner.temp }}/repin-plan.tsv
          BRANCH: repin/auto-${{ steps.reconcile.outputs.key }}
        run: |
          set -euo pipefail
          # Idempotence keys on an OPEN PR, not on the branch: a push that succeeded while the
          # PR create failed must not leave the drift silently unopened forever.
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "::notice::PR #$open_pr is already open for this exact drift; nothing to open."
            exit 0
          fi
          branch_exists=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            branch_exists=true
            echo "branch $BRANCH exists without an open PR; reusing it"
          fi

          {
            printf 'Opened by the repin reconciler: the marketplace manifest disagreed with what these plugins have released.\n\n'
            printf '| plugin | version | tag | releaseId | sha | release state |\n|---|---|---|---|---|---|\n'
            while IFS=$'\t' read -r name version tag rel_id sha is_draft; do
              [ -n "$name" ] || continue
              state=published
              [ "$is_draft" = true ] && state='**draft** (staged; the reconciler publishes it once this merges)'
              printf '| %s | %s | `%s` | %s | `%s` | %s |\n' \
                "$name" "$version" "$tag" "$rel_id" "${sha:0:12}" "$state"
            done < "$PLAN_FILE"
            if [ -n "$MIGRATE_PLUGIN" ]; then
              printf '\nThis PR migrates `%s` from a `url` entry to a `git-subdir` entry pinned to its newest prefixed release in the shared repository (dispatched by hand; the reconciler never changes an entry'"'"'s shape).\n' "$MIGRATE_PLUGIN"
            fi
            printf '\nRe-running the reconciler on this same drift and main is a no-op: the branch name is derived from both.\n'
            printf '\nThe reconciler requests auto-merge on this PR and merges it once the required checks pass. A plugin listed as **draft** is published by the next reconcile run after the merge.\n'
          } > "$RUNNER_TEMP/pr-body.md"

          if [ "$branch_exists" = false ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -b "$BRANCH"
            git add .claude-plugin/marketplace.json
            git commit -m 'chore(marketplace): repin cards to the plugins current releases'
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          fi
          if [ "$HAVE_BOT" != true ]; then
            echo "::warning::branch $BRANCH is pushed but no bot identity is available to open the PR; open it by hand: gh pr create --repo $GITHUB_REPOSITORY --base main --head $BRANCH"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title 'chore(marketplace): repin cards to the plugins current releases' \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Request auto-merge and close superseded repin PRs
        if: steps.bot_identity.outputs.have_bot == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          DESIRED_BRANCH: ${{ steps.reconcile.outputs.drift == 'true' && format('repin/auto-{0}', steps.reconcile.outputs.key) || '' }}
          EXPECTED_BLOB: ${{ steps.reconcile.outputs.blob }}
          ONLY_PLUGIN: ${{ inputs.migrate_plugin || inputs.only_plugin }}
        run: ./release/scripts/repin-land.sh

      # Runs even when an earlier step failed: publishing a draft main already pins
      # does not depend on this run's repin. It reads the manifest at the commit
      # this run checked out, not the working tree the reconcile step rewrote, and
      # re-reads live main with this job's token right before each publish.
      - name: Publish staged releases the card on main already pins
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MARKETPLACE_REPO: ${{ github.repository }}
          MARKETPLACE_TOKEN: ${{ github.token }}
          ONLY_PLUGIN: ${{ inputs.migrate_plugin || inputs.only_plugin }}
          MANIFEST: ${{ runner.temp }}/main-manifest.json
        run: |
          set -euo pipefail
          git show "${GITHUB_SHA}:.claude-plugin/marketplace.json" > "$MANIFEST"
          ./release/scripts/repin-publish.sh
