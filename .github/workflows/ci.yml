name: CI
on:
  # Pull requests, a fork's included, run here through pull_request. A push runs
  # CI only on main: a branch with a pull request got every run twice.
  push:
    branches: [main]
  pull_request:
  # A merge queue on main tests a pull request merged onto main before it lands, and
  # that test is this event. Without a queue the event never fires.
  merge_group:
permissions:
  contents: read
# A newer push to a pull request cancels the run it supersedes. A push to main gets
# a group of its own commit, so the run the release gate reads is never cancelled.
# A merge group's run is keyed on its commit too, and has finished before main moves.
# The prefix is literal and unique to this file: GitHub compares group names
# case-insensitively across workflows (pinned in release/tests/root-workflows.test.sh).
concurrency:
  group: ci-yml-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The three long parts run side by side, each on its own runner from its own checkout,
  # so none can lean on what another left behind. Run one after another they took 18-23
  # minutes (2026-11-20, #816); the required check is the `test` job at the end, which
  # passes only when every part did.
  setup:
    name: setup and layout
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: 'stub (negative probe for #818)'
        run: "true"
  hooks:
    name: hook tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: 'forced failure (negative probe for #818)'
        run: exit 1
  suites:
    name: suites and secrets scan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: 'stub (negative probe for #818)'
        run: "true"
  # The required check `setup, hooks, suites, secrets`. A job whose `needs` failed is
  # skipped unless it runs on always(), and a skipped required check counts as passed, so
  # this job always runs and fails itself unless every part succeeded. A cancelled run
  # cancels the parts, and they fail it too.
  test:
    name: setup, hooks, suites, secrets
    needs: [setup, hooks, suites]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every part passed (setup and layout, hook tests, suites and secrets scan)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: release/scripts/ci-aggregate.sh
  public-safety:
    name: public-safety scan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Structural shapes only: a home-directory path, a personal address, a private-network
      # host or an unlisted repository under a watched owner. A fork's pull request sees no
      # repository variable or secret, so the author's private-token list is not here; the
      # same script runs with --require-tokens before every public push.
      - name: No private path, address, host or repository in the tree (.public-safety-allow names each exception)
        run: bash scripts/public-safety-scan.sh
