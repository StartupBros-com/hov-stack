name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: setup, hooks, suites, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fresh-HOME install keeps the README's promises
        run: bash tests/repo/setup.test.sh
      - name: Layout keeps the root a mirror of the harness with no marketplace collision
        run: bash tests/repo/layout.test.sh
      - name: Hook tests
        run: bash hooks/tests/run.sh
      # The suite steps run even after an earlier step fails (not after a cancel), so a
      # hook-test timing flake cannot hide a suite regression; the job still fails.
      # minisign verifies the pinned dcg release in tests/dcg.test.sh, as dcg/install.sh does.
      - name: Tools the suites need that the runner image lacks (ripgrep, gawk, PyYAML, venv, minisign)
        if: ${{ !cancelled() }}
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends ripgrep gawk python3-yaml python3-venv minisign
      - name: The suite runner fails closed on its own skip list
        if: ${{ !cancelled() }}
        run: bash tests/repo/run-claude-tests.test.sh
      - name: Unit suites under tests/ (tests/claude-tests.skips names what cannot run here, and why)
        if: ${{ !cancelled() }}
        run: bash tests/run-claude-tests.sh
      - name: Secrets scan (full history, .gitleaks.toml allowlists the test fixtures)
        if: ${{ !cancelled() }}
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  public-safety:
    name: public-safety scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Structural shapes only: a home-directory path, a personal address, a private-network
      # host or an unlisted repository under a watched owner. A fork's pull request sees no
      # repository variable or secret, so the author's private-token list is not here; the
      # same script runs with --require-tokens before every public push.
      - name: No private path, address, host or repository in the tree (.public-safety-allow names each exception)
        run: bash scripts/public-safety-scan.sh
