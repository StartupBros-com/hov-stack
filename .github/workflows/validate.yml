name: Validate marketplace

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    name: Trusted syntax and policy
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision pinned CI tools
        run: ./release/scripts/provision-ci-tools.sh
      - name: Lint Tool Drop announce scripts
        run: >-
          shellcheck release/scripts/tool-drop-announce.sh
          release/scripts/latest-stable-release.sh
          release/scripts/provision-ci-tools.sh
          release/tests/provision-ci-tools.test.sh
          release/scripts/card-source.sh
          release/scripts/repin-migrate.sh
          release/scripts/repin-reconcile.sh
          release/scripts/repin-land.sh
          release/scripts/repin-publish.sh
          release/scripts/announce-pin-roll.sh
          release/tests/tool-drop-announce.test.sh
          release/tests/tool-drop-announce-retry.test.sh
          release/tests/latest-stable-release.test.sh
          release/tests/notes-summary.test.sh
          release/tests/card-source.test.sh
          release/tests/repin-migrate.test.sh
          release/tests/repin-convergence.test.sh
          release/tests/repin-reconcile.test.sh
          release/tests/repin-land.test.sh
          release/tests/repin-publish.test.sh
          release/tests/announce-pin-roll.test.sh
          release/scripts/plugin-tag.sh
          release/scripts/ci-changed-plugins.sh
          release/scripts/plugin-ci.sh
          release/scripts/ci-aggregate.sh
          release/scripts/ci-repo-checks.sh
          release/scripts/auto-release-decide.sh
          release/scripts/auto-release-tag.sh
          release/scripts/release-stage.sh
          release/scripts/release-gate.sh
          release/scripts/release-train-verify.sh
          release/scripts/publish-staged.sh
          release/scripts/check-release-notes.sh
          release/tests/plugin-tag.test.sh
          release/tests/ci-changed-plugins.test.sh
          release/tests/plugin-ci.test.sh
          release/tests/ci-aggregate.test.sh
          release/tests/ci-repo-checks.test.sh
          release/tests/auto-release-decide.test.sh
          release/tests/auto-release-tag.test.sh
          release/tests/release-stage.test.sh
          release/tests/release-gate.test.sh
          release/tests/release-train-verify.test.sh
          release/tests/publish-staged.test.sh
          release/tests/check-release-notes.test.sh
          release/tests/root-workflows.test.sh
          release/tests/release-pins.test.sh
      - name: Test pinned CI tool provisioning without network access
        run: bash ./release/tests/provision-ci-tools.test.sh
      - name: Validate marketplace without network access
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./release/scripts/validate-marketplace.sh syntax
      - name: Run marketplace fixture tests
        run: ./release/tests/validate-marketplace.test.sh
      - name: Run Tool Drop announce security tests
        run: ./release/tests/tool-drop-announce.test.sh
      - name: Run latest stable guard tests
        run: bash ./release/tests/latest-stable-release.test.sh
      - name: Run announce retry tests
        run: bash ./release/tests/tool-drop-announce-retry.test.sh
      - name: Run notes-summary tests
        run: bash ./release/tests/notes-summary.test.sh
      - name: Run repin reconcile tests
        run: bash ./release/tests/repin-reconcile.test.sh
      - name: Run repin land tests
        run: bash ./release/tests/repin-land.test.sh
      - name: Run repin publish tests
        run: bash ./release/tests/repin-publish.test.sh
      - name: Run announce pin roll tests
        run: bash ./release/tests/announce-pin-roll.test.sh
      - name: Run card source tests
        run: bash ./release/tests/card-source.test.sh
      - name: Run repin migrate tests
        run: bash ./release/tests/repin-migrate.test.sh
      - name: Run repin convergence tests
        run: bash ./release/tests/repin-convergence.test.sh

      - name: Run plugin tag tests
        run: bash ./release/tests/plugin-tag.test.sh
      - name: Run ci changed plugins tests
        run: bash ./release/tests/ci-changed-plugins.test.sh
      - name: Run plugin ci tests
        run: bash ./release/tests/plugin-ci.test.sh
      - name: Run ci aggregate tests
        run: bash ./release/tests/ci-aggregate.test.sh
      - name: Run ci repo checks tests
        run: bash ./release/tests/ci-repo-checks.test.sh
      - name: Run auto release decide tests
        run: bash ./release/tests/auto-release-decide.test.sh
      - name: Run auto release tag tests
        run: bash ./release/tests/auto-release-tag.test.sh
      - name: Run release stage tests
        run: bash ./release/tests/release-stage.test.sh
      - name: Run release gate tests
        run: bash ./release/tests/release-gate.test.sh
      - name: Run release train verify tests
        run: bash ./release/tests/release-train-verify.test.sh
      - name: Run publish staged tests
        run: bash ./release/tests/publish-staged.test.sh
      - name: Run check release notes tests
        run: bash ./release/tests/check-release-notes.test.sh
      - name: Run root workflows tests
        run: bash ./release/tests/root-workflows.test.sh
      - name: Run release pins tests
        run: bash ./release/tests/release-pins.test.sh
      - name: Run pins PR title tests
        run: bash ./release/tests/pins-pr-title.test.sh
      - name: Lint root workflows
        run: actionlint -config-file .github/actionlint.yaml .github/workflows/plugins-ci.yml .github/workflows/auto-release.yml .github/workflows/release.yml .github/workflows/publish-staged-release.yml .github/workflows/release-train.yml .github/workflows/release-pins-refresh.yml .github/workflows/ci.yml .github/workflows/hov-tool-drop-announce.yml .github/workflows/validate.yml .github/workflows/repin-reconcile.yml

  public-pr-syntax:
    name: Public PR data check
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.head.repo.fork != false)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out untrusted pull request
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          persist-credentials: false
      - name: Parse marketplace data without repository code
        run: jq empty .claude-plugin/marketplace.json

  full:
    name: Pinned sources
    if: vars.HOV_SOURCES_PUBLIC == 'true' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.fork == false))
    needs: syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Provision pinned CI tools
        run: ./release/scripts/provision-ci-tools.sh
      - name: Validate pinned source payloads
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./release/scripts/validate-marketplace.sh full
      - name: Verify install-release pins against their downloads
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./release/scripts/release-pins.sh verify --if-changed-since "$BASE_REF"
