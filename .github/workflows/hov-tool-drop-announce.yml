name: hov Tool Drop announce

# Reusable announce-only release train for every marketplace plugin, whether
# it releases from its own repository on v<version> tags or from a shared
# repository on <name>--v<version> tags, and for the products listed in the
# PRODUCTS table of release/scripts/tool-drop-announce.sh (today HoV Router).
#
# A product is not a marketplace plugin. It calls this workflow exactly as a
# plugin does, but its repository has no VERSION file, no
# .claude-plugin/plugin.json and no marketplace manifest entry or card (the
# product's card lives in the announce endpoint's own registry). It must release
# on plain v<major.minor.patch> tags. The helper recognises a product by the
# caller's full repository name and repository id, skips the plugin and
# marketplace checks, and keeps the draft/prerelease skip, the latest-stable
# guard and the default-branch ancestry step below. The announce endpoint
# re-verifies every token claim and the live release either way.
#
# Caller, pinned to a full commit SHA of the repository holding this file:
#
#   name: Release train
#   on:
#     release:
#       types: [published, edited]
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     announce:
#       uses: <owner>/<repo>/.github/workflows/hov-tool-drop-announce.yml@<sha>
#       # Optional. The marketplace manifest is read from the repository this
#       # file lives in unless a caller names another one here.
#       with:
#         marketplace-repository: <owner>/<repo>
#
# Identity is the OIDC token, not a shared secret: the announce endpoint
# verifies repository/repository_owner claims and pins job_workflow_ref to
# THIS file's path, so only releases flowing through this blessed workflow
# can post a card, and no repo can announce as another.

on:
  workflow_call:
    inputs:
      marketplace-repository:
        description: >-
          Repository holding the marketplace manifest, as owner/name. Empty
          means the repository this workflow file lives in.
        type: string
        required: false

permissions: {}

jobs:
  announce:
    concurrency:
      group: hov-tool-drop-announce-${{ github.repository }}-${{ github.event.release.id }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      # Every release event reaches this step inside the immutable-release-ID
      # concurrency group. Current API state—not stale event fields—decides
      # whether any checkout, latest-stable lookup, or announcement may run.
      - name: Resolve current release eligibility
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CURRENT_RELEASE_FILE: ${{ runner.temp }}/hov-tool-drop-current-release.json
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" >"$CURRENT_RELEASE_FILE"
          eligible="$(jq -r \
            --arg expected_id "$RELEASE_ID" \
            --arg expected_tag "$RELEASE_TAG" \
            '
              if type == "object" and
                has("id") and
                (.id | type == "number") and
                (.id > 0) and
                (.id == (.id | floor)) and
                ((.id | tostring) == $expected_id) and
                has("tag_name") and
                (.tag_name | type == "string") and
                (.tag_name == $expected_tag) and
                has("body") and
                (.body == null or (.body | type == "string")) and
                has("draft") and
                (.draft | type == "boolean") and
                has("prerelease") and
                (.prerelease | type == "boolean")
              then ((.draft | not) and (.prerelease | not))
              else error("current release record failed validation")
              end
            ' "$CURRENT_RELEASE_FILE")"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          if [[ "$eligible" != true ]]; then
            echo "::notice title=Not announced::Current release is draft or prerelease"
          fi

      - name: Check out release commit
        if: steps.current.outputs.eligible == 'true'
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # AFTER this ancestry check, never before: the trusted helper reads the
      # checked-out tag's VERSION and plugin manifest. Every tag-derived input
      # stays below the proof that the tag descends from the protected default
      # branch, and no executable helper code comes from the tag.
      - name: Require release commit on default branch
        if: steps.current.outputs.eligible == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          release_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH"

      - name: Check out trusted workflow helper
        if: steps.current.outputs.eligible == 'true'
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: trusted-workflow
          persist-credentials: false

      # This mutable checkout supplies current catalog data only. No code from
      # it is executed; the helper above is pinned to the called workflow SHA.
      # The manifest lives in this workflow's own repository unless the caller
      # names another; defaulting to the caller's repository would make a
      # per-plugin caller read a repository with no manifest.
      - name: Check out current marketplace manifest
        if: steps.current.outputs.eligible == 'true'
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          repository: ${{ inputs.marketplace-repository || job.workflow_repository }}
          ref: main
          path: marketplace-data
          persist-credentials: false

      # Latest is judged inside the release tag's family (its <name>-- prefix,
      # or plain v<version> tags), by semver over a paginated listing, never by
      # the repository-wide latest release: a shared repository has one of
      # those. The guard runs from the trusted checkout, never from the tag.
      - name: Resolve latest stable release
        if: steps.current.outputs.eligible == 'true'
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.event.repository.name }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: ./trusted-workflow/release/scripts/latest-stable-release.sh

      - name: Announce release
        if: steps.current.outputs.eligible == 'true'
        env:
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.event.repository.name }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          CURRENT_RELEASE_FILE: ${{ runner.temp }}/hov-tool-drop-current-release.json
          LATEST_STABLE_ID: ${{ steps.stable.outputs.id }}
          SOURCE_ROOT: ${{ github.workspace }}
          MARKETPLACE_MANIFEST: ${{ github.workspace }}/marketplace-data/.claude-plugin/marketplace.json
        run: |
          source_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          export SOURCE_SHA="$source_sha"
          ./trusted-workflow/release/scripts/tool-drop-announce.sh
